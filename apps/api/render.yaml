# Render Blueprint for Serveo API
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: serveo-api
    env: node
    region: frankfurt # Close to Egypt
    plan: free
    buildCommand: cd ../.. && pnpm install && pnpm --filter @repo/shared build && cd apps/api && pnpm build && npx prisma generate
    startCommand: cd apps/api && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: BASE_URL
        sync: false
